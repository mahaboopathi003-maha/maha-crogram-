<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maha C Code Generator</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  padding:20px 12px;
  background:#080d1b;
  color:white;
  font-family:Arial,sans-serif;
}
.container{max-width:700px;margin:auto}
.header{
  text-align:center;
  background:#e52c70;
  padding:22px;
  border-radius:14px;
}
.header h2{margin:0}
.card{
  margin-top:20px;
  padding:20px;
  border:1px solid #00d9ff;
  border-radius:12px;
  background:#10182b;
}
h1{text-align:center;color:#00e5ff}
p{text-align:center;color:#b8c6dd}
input{
  width:100%;
  padding:13px;
  margin:10px 0;
  border:1px solid #00f5a0;
  border-radius:6px;
  background:#080d1b;
  color:white;
}
button{
  width:100%;
  padding:13px;
  margin:7px 0;
  border:0;
  border-radius:6px;
  background:linear-gradient(90deg,#00d9ff,#00f5a0);
  color:#06111b;
  font-weight:bold;
  cursor:pointer;
}
.file{
  background:#172741;
  color:white;
  border:1px solid #1686a4;
  font-size:12px;
}
#status{color:#00f5a0;font-size:13px}
</style>
</head>

<body>
<div class="container">

<div class="header">
  <h2>💻 MAHA CODE STUDIO</h2>
  <p style="color:white">Design by Maha</p>
</div>

<div class="card">
<h1>C PROGRAM GENERATOR</h1>
<p>Generate and download C program files</p>

<label for="name">Enter your name</label>
<input id="name" placeholder="Enter your name">

<div id="exercises"></div>

<h3 style="color:#00e5ff;text-align:center">
Generated C Files
</h3>

<div id="files"></div>

<button id="downloadAll" onclick="downloadZip()" disabled>
DOWNLOAD ALL FILES AS ZIP
</button>

<p id="status" role="status"></p>
</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<script>
const exercises = [
{
title:"Exercise 1: Operators",
programs:[
["Arithmetic Operators",`int a=10,b=5;
printf("Sum = %d\\n",a+b);
printf("Difference = %d\\n",a-b);
printf("Product = %d\\n",a*b);`],
["Relational Operators",`int a=10,b=20;
printf("%d\\n",a<b);
printf("%d\\n",a==b);`],
["Logical Operators",`int a=10;
printf("%d\\n",a>5 && a<20);
printf("%d\\n",a<5 || a==10);`],
["Assignment Operators",`int a=10;
a+=5;
printf("%d\\n",a);
a-=2;
printf("%d\\n",a);`],
["Increment Operators",`int a=5;
printf("%d\\n",++a);
printf("%d\\n",--a);`],
["Conditional Operator",`int a=10,b=20;
printf("Largest = %d\\n",a>b?a:b);`],
["Sizeof Operator",`int a;
float b;
char c;
printf("%zu\\n",sizeof(a));
printf("%zu\\n",sizeof(b));
printf("%zu\\n",sizeof(c));`]
]
},
{
title:"Exercise 2: Control Statements",
programs:[
["If Else",`int n=7;
if(n%2==0) printf("Even");
else printf("Odd");`],
["Else If",`int mark=85;
if(mark>=90) printf("A Grade");
else if(mark>=80) printf("B Grade");
else printf("C Grade");`],
["Switch Case",`int n=2;
switch(n){
case 1: printf("One"); break;
case 2: printf("Two"); break;
default: printf("Invalid");
}`],
["For Loop",`for(int i=1;i<=10;i++)
printf("%d ",i);`],
["While Loop",`int i=1;
while(i<=5){
printf("%d ",i);
i++;
}`],
["Do While Loop",`int i=1;
do{
printf("%d ",i);
i++;
}while(i<=5);`],
["Break Continue",`for(int i=1;i<=10;i++){
if(i==3) continue;
if(i==8) break;
printf("%d ",i);
}`]
]
},
{
title:"Exercise 3: Arrays and Strings",
programs:[
["Array Sum",`int a[]={10,20,30},sum=0;
for(int i=0;i<3;i++) sum+=a[i];
printf("%d",sum);`],
["Largest Array Element",`int a[]={10,50,20};
int max=a[0];
for(int i=1;i<3;i++)
if(a[i]>max) max=a[i];
printf("%d",max);`],
["Reverse Array",`int a[]={1,2,3,4,5};
for(int i=4;i>=0;i--)
printf("%d ",a[i]);`],
["Linear Search",`int a[]={10,20,30};
int key=20,found=0;
for(int i=0;i<3;i++)
if(a[i]==key) found=1;
printf("%s",found?"Found":"Not Found");`],
["Matrix Addition",`int a[2][2]={{1,2},{3,4}};
int b[2][2]={{5,6},{7,8}};
for(int i=0;i<2;i++){
for(int j=0;j<2;j++)
printf("%d ",a[i][j]+b[i][j]);
printf("\\n");
}`],
["String Length",`char s[]="Hello";
printf("%zu",strlen(s));`],
["String Copy",`char a[]="Hello";
char b[20];
strcpy(b,a);
printf("%s",b);`]
]
},
{
title:"Exercise 4: Functions, Pointers and Structures",
programs:[
["Function Addition",`printf("Sum = %d",add(10,20));`],
["Factorial",`int n=5,f=1;
for(int i=1;i<=n;i++) f*=i;
printf("%d",f);`],
["Pointer",`int a=25;
int *p=&a;
printf("%d",*p);`],
["Swap Using Pointers",`int a=10,b=20,temp;
int *p=&a,*q=&b;
temp=*p;*p=*q;*q=temp;
printf("%d %d",a,b);`],
["Structure Student",`struct Student{
char name[20];
int mark;
};
struct Student s={"Maha",90};
printf("%s %d",s.name,s.mark);`],
["Dynamic Memory",`int *p=malloc(3*sizeof(int));
if(p!=NULL){
for(int i=0;i<3;i++) p[i]=(i+1)*10;
for(int i=0;i<3;i++) printf("%d ",p[i]);
free(p);
}`],
["Linked List Node",`struct Node{
int data;
struct Node *next;
};
struct Node *p=malloc(sizeof(struct Node));
if(p!=NULL){
p->data=100;
p->next=NULL;
printf("%d",p->data);
free(p);
}`]
]
}
];

let generated=[];

function build(){
const root=document.getElementById("exercises");
exercises.forEach((ex,index)=>{
const title=document.createElement("h3");
title.style.color="#00f5a0";
title.textContent=ex.title;
const btn=document.createElement("button");
btn.textContent="GENERATE EXERCISE "+(index+1);
btn.onclick=()=>generate(index);
root.append(title,btn);
});
}

function generate(index){
const name=document.getElementById("name").value.trim();
if(!name){
document.getElementById("status").textContent="Enter your name first!";
return;
}
const safe=name.replace(/[^a-z0-9_-]/gi,"_");
generated=exercises[index].programs.map((p,i)=>{
const code=`/* ${p[0]} - Created by ${name} */
#include <stdio.h>
#include <string.h>
#include <stdlib.h>

int main(void){
${p[1]}
return 0;
}
`;
return {
name:safe+"_program_"+String(index*7+i+1).padStart(2,"0")+".c",
code:code
};
});
renderFiles();
document.getElementById("status").textContent=
"Exercise generated! Download your C files below.";
}

function renderFiles(){
const root=document.getElementById("files");
root.innerHTML="";
generated.forEach(file=>{
const btn=document.createElement("button");
btn.className="file";
btn.textContent="⬇ DOWNLOAD "+file.name;
btn.onclick=()=>downloadFile(file);
root.appendChild(btn);
});
document.getElementById("downloadAll").disabled=generated.length===0;
}

function downloadFile(file){
const blob=new Blob([file.code],{type:"text/plain"});
const url=URL.createObjectURL(blob);
const a=document.createElement("a");
a.href=url;
a.download=file.name;
document.body.appendChild(a);
a.click();
a.remove();
setTimeout(()=>URL.revokeObjectURL(url),1500);
}

async function downloadZip(){
if(!generated.length)return;
if(typeof JSZip==="undefined"){
document.getElementById("status").textContent=
"ZIP library needs internet. Connect internet and retry.";
return;
}
const zip=new JSZip();
generated.forEach(file=>zip.file(file.name,file.code));
const blob=await zip.generateAsync({type:"blob"});
const url=URL.createObjectURL(blob);
const a=document.createElement("a");
a.href=url;
a.download="Maha_C_Programs.zip";
document.body.appendChild(a);
a.click();
a.remove();
setTimeout(()=>URL.revokeObjectURL(url),2000);
document.getElementById("status").textContent="ZIP download started!";
}

build();
</script>
</body>
</html>
